gmail:
  smtp: gmail-smtp-in.l.google.com
  rcpt: "{}@gmail.com"
  link: "mailto:{}@gmail.com"
  signup: https://accounts.google.com/signup
  taken: {status: [250, 552]}  # 552 = mailbox exists but is over quota
  probably_free: {status: 550, contains: 5.1.1}  # google never hands out a deleted address again
  chars: a-z0-9.
  length: 6-30
  known: contact
hey:
  name: HEY World
  url: https://world.hey.com/{}
  signup: https://www.hey.com/
  taken: {status: 200, lands: "world\\.hey\\.com/{}$"}
  probably_free: {lands: "www\\.hey\\.com/world"}  # a hey.com address can exist without a world page
  chars: a-z0-9._-
  length: 2-40
  known: dhh
