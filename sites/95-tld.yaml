# domains: the registry itself answers (rdap, or whois where there is no rdap). a domain has no _ : my_name is checked as myname
ch:
  name: .ch
  url: https://rdap.nic.ch/domain/{}.ch
  taken: {status: 200, contains: ldhName}
  free: {status: 404}
  link: https://{}.ch
  signup: https://www.namecheap.com/domains/registration/results/?domain={}.ch
  chars: a-z0-9-
  strip: _
  length: 3-63
  known: google
  fallback:  # switch limits its rdap quickly, then the dns answers. a domain without nameservers looks free there, hence probably
    url: https://dns.google/resolve?name={}.ch&type=NS
    taken: {contains: ['"Status":0', '"Answer"']}
    probably_free: {contains: '"Status":3'}
