soundcloud:
  url: https://soundcloud.com/{}
  signup: https://soundcloud.com/signin
  taken: {status: 200}
  free: {status: 404}
  chars: a-z0-9_-
  length: 3-25
  known: soundcloud
bandcamp:
  url: https://{}.bandcamp.com/
  signup: https://bandcamp.com/signup?new_domain={}
  taken: {status: 200, lands: "^https://{}\\.bandcamp\\.com"}
  free: {lands: "signup\\?new_domain="}
  chars: a-z0-9-
  length: 4-63
  known: tycho
mixcloud:
